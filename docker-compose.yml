services:
  piano-api:
    build: .
    image: piano-transcription-api:latest
    ports:
      - "7777:7777"
    environment:
      PIANO_DEVICE: cuda
      PIANO_DATA_DIR: /data
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
